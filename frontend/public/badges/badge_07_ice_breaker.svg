<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blue_gem" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#6ab4ff"/>
      <stop offset="40%" style="stop-color:#2266cc"/>
      <stop offset="100%" style="stop-color:#0a2a88"/>
    </linearGradient>
    <filter id="shadow7"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/></filter>
  </defs>
  <!-- Hexagon gem -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="url(#blue_gem)" stroke="#1144aa" stroke-width="2" filter="url(#shadow7)"/>
  <!-- Facets -->
  <polygon points="50,5 90,27.5 50,50" fill="#4499ee" opacity="0.4"/>
  <polygon points="50,5 10,27.5 50,50" fill="#88ccff" opacity="0.3"/>
  <polygon points="10,27.5 10,72.5 50,50" fill="#2266cc" opacity="0.3"/>
  <polygon points="90,27.5 90,72.5 50,50" fill="#1144aa" opacity="0.3"/>
  <!-- Snowflake -->
  <g transform="translate(50,50)" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-20" y1="0" x2="20" y2="0"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
    <line x1="-8" y1="-20" x2="0" y2="-14" /><line x1="8" y1="-20" x2="0" y2="-14"/>
    <line x1="-8" y1="20" x2="0" y2="14"/><line x1="8" y1="20" x2="0" y2="14"/>
    <line x1="-20" y1="-8" x2="-14" y2="0"/><line x1="-20" y1="8" x2="-14" y2="0"/>
    <line x1="20" y1="-8" x2="14" y2="0"/><line x1="20" y1="8" x2="14" y2="0"/>
  </g>
  <circle cx="50" cy="50" r="3" fill="white" opacity="0.8"/>
  <!-- Top highlight -->
  <polygon points="50,8 85,28 50,50" fill="white" opacity="0.08"/>
</svg>
