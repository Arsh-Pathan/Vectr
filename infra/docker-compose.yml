version: "3.8"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vectr-backend
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - DATABASE_URL=sqlite:////app/data/vectr.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./data/backend:/app/data
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vectr-frontend
    restart: unless-stopped
    # NGINX runs as root initially to bind port 80, but worker drops to lower priv.
    # CSky standard typically uses PUID/PGID, so we'll pass it if needed, but standard nginx image needs root to start.
    # We will leave user blank for frontend to ensure nginx binds port 80 properly, or use unprivileged nginx if strict.
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
    networks:
      - proxy
      - internal
    depends_on:
      - backend

networks:
  proxy:
    external: true
  internal:
    driver: bridge
