<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <linearGradient id="legendary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3"/>
      <stop offset="50%" style="stop-color:#db2777"/>
      <stop offset="100%" style="stop-color:#831843"/>
    </linearGradient>
    <filter id="s20"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.6"/></filter>
    <radialGradient id="star_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Rosette/Star shape -->
  <path d="M50 10 L60 25 L78 22 L75 38 L90 50 L75 62 L78 78 L60 75 L50 90 L40 75 L22 78 L25 62 L10 50 L25 38 L22 22 L40 25 Z" fill="url(#legendary)" stroke="#831843" stroke-width="2" filter="url(#s20)"/>
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="22" fill="#4c1d95" stroke="#fbcfe8" stroke-width="1.5"/>
  <!-- Glow behind star -->
  <circle cx="50" cy="50" r="18" fill="url(#star_glow)"/>
  <!-- Giant Star -->
  <polygon points="50,35 54,46 65,46 56,53 59,64 50,57 41,64 44,53 35,46 46,46" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <!-- Highlight -->
  <path d="M50 14 L58 26 L73 24 L70 36 L82 46" stroke="white" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
